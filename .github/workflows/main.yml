name: Build COMPLETE MRH APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          mkdir project
          unzip -o "*.zip" -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd project
          find . -name settings.gradle.kts -exec dirname {} \; | head -1
          gradle -p "$(find . -name settings.gradle.kts -exec dirname {} \; | head -1)" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COMPLETE-MRH-APK
          path: project/**/build/outputs/apk/debug/*.apk
          
